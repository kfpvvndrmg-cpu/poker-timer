<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Poker">
    <link rel="apple-touch-icon" href="OIP.webp">
    <link rel="icon" href="OIP.webp" type="image/webp">
    
    <title>Poker Timer V3</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --accent-red: #d32f2f;
            --accent-green: #2e7d32;
            --accent-blue: #1976d2;
            --border-color: #333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 600px;
        }

        header img {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            object-fit: cover;
        }

        .card {
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* Timer & Blinds */
        .timer-display {
            font-size: 60px;
            font-weight: bold;
            text-align: center;
            margin: 5px 0;
            color: var(--accent-green);
        }

        .blinds-display {
            text-align: center;
            font-size: 26px;
            color: var(--accent-red);
            font-weight: bold;
        }

        .controls { display: flex; gap: 10px; margin-top: 10px; }
        
        button {
            background-color: #333; color: white; border: none;
            padding: 10px; border-radius: 8px; font-size: 14px;
            cursor: pointer; font-weight: bold; flex: 1;
        }
        button:active { background-color: #555; }
        .btn-play { background-color: var(--accent-green); }
        .btn-pause { background-color: #ff9800; }
        .btn-next { background-color: var(--accent-blue); }
        .btn-small { padding: 6px 10px; font-size: 12px; flex: none; }
        .btn-danger { background-color: var(--accent-red); }

        /* Inputs */
        .row {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px; gap: 10px;
        }
        input, select {
            background-color: #333; color: white; border: 1px solid #555;
            padding: 8px; border-radius: 6px; font-size: 14px;
            width: 100%; box-sizing: border-box;
        }
        .input-short { width: 80px; text-align: center; font-weight: bold; }

        /* Players List */
        .player-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #2a2a2a; padding: 8px 12px; margin-bottom: 5px; border-radius: 6px;
        }
        .player-name { font-weight: bold; }
        
        /* Table */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { padding: 8px; text-align: center; border-bottom: 1px solid var(--border-color); }
        th { color: var(--text-muted); font-weight: normal; }
        .gold { color: #ffd700; font-weight: bold; }

    </style>
</head>
<body>

    <header>
        <img src="OIP.webp" alt="Logo">
        <select id="tournamentSelect" onchange="loadTournament()"></select>
        <button class="btn-small btn-next" onclick="createNewTournament()">+ Créer</button>
    </header>

    <!-- Timer & Blinds -->
    <div class="card">
        <div class="blinds-display">
            Blinds: <span id="sb">10</span> / <span id="bb">20</span>
        </div>
        <div class="timer-display" id="timeDisplay">15:00</div>
        <div class="controls">
            <button class="btn-play" id="btnPlay" onclick="toggleTimer()">▶ Play</button>
            <button class="btn-next" onclick="nextLevel()">⏭ Suiv.</button>
            <button onclick="resetTimer()">🔄 Reset</button>
        </div>
    </div>

    <!-- Paramètres -->
    <div class="card">
        <h3>Paramètres en direct</h3>
        <div class="row">
            <label style="color: var(--accent-red); font-weight: bold;">Modifier Petite Blind (SB)</label>
            <input type="number" class="input-short" id="currentSbInput" onchange="updateCustomSb()">
        </div>
        <div class="row">
            <label>Durée rounds (min)</label>
            <input type="number" class="input-short" id="roundDuration" onchange="saveSettings()">
        </div>
        <div class="row">
            <label>Buy-in (€)</label>
            <input type="number" class="input-short" id="buyin" onchange="saveSettings(); updateUI()">
        </div>
        <div class="row">
            <label>Recaves Totales</label>
            <div style="display:flex; gap:5px;">
                <button class="btn-small" onclick="changeRebuys(-1)">-</button>
                <input type="number" class="input-short" id="rebuys" readonly>
                <button class="btn-small" onclick="changeRebuys(1)">+</button>
            </div>
        </div>
    </div>

    <!-- Gestion des Joueurs -->
    <div class="card">
        <h3>Joueurs Inscrits : <span id="playerCount">0</span></h3>
        <div class="row">
            <input type="text" id="newPlayerName" placeholder="Nom du joueur...">
            <button class="btn-small btn-next" onclick="addPlayer()">Ajouter</button>
        </div>
        <div id="activePlayersList">
            <!-- Liste des joueurs en jeu -->
        </div>
    </div>

    <!-- Tableau des Scores -->
    <div class="card">
        <div class="row">
            <h3>Classement & Scores</h3>
            <strong style="color: var(--accent-green);">Prizepool: <span id="prizepoolTotal">0</span> €</strong>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Pos.</th>
                    <th>Joueur</th>
                    <th>Pts</th>
                    <th>Gain</th>
                </tr>
            </thead>
            <tbody id="leaderboard">
                <!-- Généré par JS -->
            </tbody>
        </table>
    </div>

    <script>
        // --- DONNÉES ET ÉTAT ---
        let tournaments = JSON.parse(localStorage.getItem('pokerTournaments')) || {};
        let currentId = localStorage.getItem('currentTourneyId') || null;
        
        let tData = {
            name: "Nouveau Tournoi",
            duration: 15,
            buyin: 20,
            rebuys: 0,
            level: 1,
            timeRemaining: 15 * 60,
            customSb: null,
            players: [] 
        };

        let timerInterval = null;
        let isRunning = false;

        // --- INITIALISATION ---
        function init() {
            if (Object.keys(tournaments).length === 0) {
                createNewTournament("Mon Premier Tournoi");
            } else {
                if (!currentId || !tournaments[currentId]) {
                    currentId = Object.keys(tournaments)[0];
                }
                loadTournament(currentId);
            }
            updateSelectMenu();
        }

        // --- GESTION DES TOURNOIS ---
        function createNewTournament(defaultName = null) {
            let name = defaultName || prompt("Nom du nouveau tournoi ?");
            if (!name) return;
            
            let id = 't_' + Date.now();
            tournaments[id] = {
                name: name, duration: 15, buyin: 20, rebuys: 0, level: 1,
                timeRemaining: 15 * 60, customSb: null, players: []
            };
            
            currentId = id;
            saveAll();
            updateSelectMenu();
            loadTournament(id);
        }

        function updateSelectMenu() {
            const select = document.getElementById('tournamentSelect');
            select.innerHTML = '';
            for (let id in tournaments) {
                let opt = document.createElement('option');
                opt.value = id;
                opt.textContent = tournaments[id].name;
                if (id === currentId) opt.selected = true;
                select.appendChild(opt);
            }
        }

        function loadTournament(id = null) {
            if (!id) id = document.getElementById('tournamentSelect').value;
            currentId = id;
            tData = tournaments[id];
            
            document.getElementById('roundDuration').value = tData.duration;
            document.getElementById('buyin').value = tData.buyin;
            document.getElementById('rebuys').value = tData.rebuys;
            
            if (isRunning) toggleTimer(); 
            
            updateUI();
            saveAll();
        }

        function saveSettings() {
            tData.duration = parseInt(document.getElementById('roundDuration').value) || 15;
            tData.buyin = parseInt(document.getElementById('buyin').value) || 0;
            saveAll();
        }

        function saveAll() {
            tournaments[currentId] = tData;
            localStorage.setItem('pokerTournaments', JSON.stringify(tournaments));
            localStorage.setItem('currentTourneyId', currentId);
        }

        // --- TIMER ET BLINDS ---
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateBlindsDisplay() {
            let sb, bb;
            if (tData.customSb) {
                sb = tData.customSb;
            } else {
                let multiplier = tData.level === 1 ? 1 : tData.level === 2 ? 2 : tData.level === 3 ? 3 : tData.level === 4 ? 4 : tData.level === 5 ? 6 : tData.level * 2;
                sb = 10 * multiplier;
            }
            bb = sb * 2;
            
            document.getElementById('sb').innerText = sb;
            document.getElementById('bb').innerText = bb;
            document.getElementById('currentSbInput').value = sb; // Met à jour la case
        }

        function updateCustomSb() {
            let newSb = parseInt(document.getElementById('currentSbInput').value);
            if (newSb && newSb > 0) {
                tData.customSb = newSb;
                updateBlindsDisplay();
                saveAll();
            }
        }

        function toggleTimer() {
            const btn = document.getElementById('btnPlay');
            if (isRunning) {
                clearInterval(timerInterval);
                btn.innerText = "▶ Play";
                btn.classList.replace('btn-pause', 'btn-play');
            } else {
                timerInterval = setInterval(() => {
                    if (tData.timeRemaining > 0) {
                        tData.timeRemaining--;
                        document.getElementById('timeDisplay').innerText = formatTime(tData.timeRemaining);
                    } else {
                        clearInterval(timerInterval);
                        alert("Fin du niveau ! Blinds augmentées.");
                        nextLevel();
                    }
                }, 1000);
                btn.innerText = "⏸ Pause";
                btn.classList.replace('btn-play', 'btn-pause');
            }
            isRunning = !isRunning;
        }

        function nextLevel() {
            tData.level++;
            tData.customSb = null; // Annule la modification manuelle pour reprendre l'auto
            tData.timeRemaining = tData.duration * 60;
            updateUI();
            saveAll();
        }

        function resetTimer() {
            if(confirm("Remettre le chrono et les blinds à zéro pour ce tournoi ?")) {
                tData.level = 1;
                tData.customSb = null;
                tData.timeRemaining = tData.duration * 60;
                if (isRunning) toggleTimer();
                updateUI();
                saveAll();
            }
        }

        function changeRebuys(delta) {
            if (tData.rebuys + delta >= 0) {
                tData.rebuys += delta;
                document.getElementById('rebuys').value = tData.rebuys;
                updateUI();
                saveAll();
            }
        }

        // --- GESTION DES JOUEURS ET SCORES ---
        function addPlayer() {
            const input = document.getElementById('newPlayerName');
            const name = input.value.trim();
            if (name) {
                tData.players.push({
                    id: Date.now(), name: name, active: true, rank: null
                });
                input.value = '';
                updateUI();
                saveAll();
            }
        }

        function eliminatePlayer(id) {
            let activeCount = tData.players.filter(p => p.active).length;
            let player = tData.players.find(p => p.id === id);
            if (player && player.active) {
                if(confirm(`Éliminer ${player.name} à la position ${activeCount} ?`)) {
                    player.active = false;
                    player.rank = activeCount;
                    updateUI();
                    saveAll();
                }
            }
        }

        function reactivatePlayer(id) {
            let player = tData.players.find(p => p.id === id);
            if (player) {
                player.active = true;
                player.rank = null;
                updateUI();
                saveAll();
            }
        }

        function deletePlayer(id) {
            if(confirm("Supprimer définitivement ce joueur ?")) {
                tData.players = tData.players.filter(p => p.id !== id);
                let eliminated = tData.players.filter(p => !p.active).sort((a,b) => b.rank - a.rank);
                let activeCount = tData.players.filter(p => p.active).length;
                eliminated.forEach((p, index) => { p.rank = activeCount + index + 1; });
                updateUI();
                saveAll();
            }
        }

        function updateUI() {
            document.getElementById('timeDisplay').innerText = formatTime(tData.timeRemaining);
            updateBlindsDisplay();

            let totalEntries = tData.players.length + tData.rebuys;
            let prizepool = totalEntries * tData.buyin;
            document.getElementById('prizepoolTotal').innerText = prizepool;
            document.getElementById('playerCount').innerText = tData.players.length;

            const activeList = document.getElementById('activePlayersList');
            const leaderboard = document.getElementById('leaderboard');
            activeList.innerHTML = '';
            leaderboard.innerHTML = '';

            let activePlayers = tData.players.filter(p => p.active);
            let eliminatedPlayers = tData.players.filter(p => !p.active).sort((a, b) => a.rank - b.rank);
            let placesPayees = Math.max(1, Math.ceil(tData.players.length / 4));

            activePlayers.forEach(p => {
                activeList.innerHTML += `
                    <div class="player-item">
                        <span class="player-name">🟢 ${p.name}</span>
                        <div>
                            <button class="btn-small btn-danger" onclick="eliminatePlayer(${p.id})">Éliminer</button>
                            <button class="btn-small" style="background:#555;" onclick="deletePlayer(${p.id})">❌</button>
                        </div>
                    </div>
                `;
            });

            let displayLeaderboard = [...eliminatedPlayers];
            if (activePlayers.length === 1 && tData.players.length > 1) {
                let winner = {...activePlayers[0], rank: 1};
                displayLeaderboard.unshift(winner);
            }

            displayLeaderboard.forEach(p => {
                let points = Math.round((Math.sqrt(tData.players.length) / Math.sqrt(p.rank)) * 10);
                
                let gain = 0;
                if (p.rank <= placesPayees) {
                    if (placesPayees === 1) gain = prizepool;
                    else if (placesPayees === 2) gain = p.rank === 1 ? prizepool * 0.65 : prizepool * 0.35;
                    else if (placesPayees === 3) gain = p.rank === 1 ? prizepool * 0.50 : p.rank === 2 ? prizepool * 0.30 : prizepool * 0.20;
                    else {
                        let part = (placesPayees - p.rank + 1) / ((placesPayees * (placesPayees + 1)) / 2);
                        gain = prizepool * part;
                    }
                }

                let isFirst = p.rank === 1;
                leaderboard.innerHTML += `
                    <tr>
                        <td class="${isFirst ? 'gold' : ''}">${p.rank}</td>
                        <td class="${isFirst ? 'gold' : ''}">
                            ${p.name} 
                            ${p.active ? '' : `<button class="btn-small" style="padding:2px 5px; font-size:10px; margin-left:5px;" onclick="reactivatePlayer(${p.id})">↩️</button>`}
                        </td>
                        <td>${points}</td>
                        <td style="color: ${gain > 0 ? 'var(--accent-green)' : 'var(--text-muted)'}">
                            ${gain > 0 ? Math.round(gain) + ' €' : '-'}
                        </td>
                    </tr>
                `;
            });
        }

        window.onload = init;
    </script>
</body>
</html>
