<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Poker">
    <link rel="apple-touch-icon" href="OIP.webp">
    <link rel="icon" href="OIP.webp" type="image/webp">
    
    <title>Poker Timer V7</title>
    <style>
        :root {
            --bg-color: #121212; --panel-bg: #1e1e1e; --text-main: #ffffff;
            --text-muted: #aaaaaa; --accent-red: #d32f2f; --accent-green: #2e7d32;
            --accent-blue: #1976d2; --accent-orange: #ff9800; --accent-gold: #ffd700;
            --border-color: #333;
        }

        body {
            background-color: var(--bg-color); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center;
            padding-bottom: 50px;
        }

        header {
            display: flex; align-items: center; gap: 8px; margin-bottom: 15px; width: 100%; max-width: 600px;
        }

        header img { width: 45px; height: 45px; border-radius: 10px; object-fit: cover; }

        .card {
            background-color: var(--panel-bg); border-radius: 12px; padding: 15px;
            margin-bottom: 15px; width: 100%; max-width: 600px; box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* Timer & Blinds */
        .timer-display {
            font-size: 65px; font-weight: bold; text-align: center; margin: 0; color: var(--accent-green);
        }
        .blinds-display {
            text-align: center; font-size: 26px; color: var(--accent-red); font-weight: bold;
            display: flex; flex-direction: column; align-items: center;
        }
        .level-badge {
            font-size: 14px; background: #333; padding: 4px 10px; border-radius: 20px; color: white; margin-bottom: 5px;
        }

        .controls { display: flex; gap: 10px; margin-top: 10px; }
        
        button {
            background-color: #333; color: white; border: none; padding: 12px; border-radius: 8px;
            font-size: 14px; cursor: pointer; font-weight: bold; flex: 1; transition: 0.2s;
        }
        .btn-play { background-color: var(--accent-green); }
        .btn-pause { background-color: var(--accent-orange); }
        .btn-next { background-color: var(--accent-blue); }
        .btn-danger { background-color: var(--accent-red); }
        .btn-small { padding: 8px 8px; font-size: 12px; flex: none; }
        .btn-struct { background: #444; color: #fff; margin-top: 5px; font-size: 12px; padding: 8px 15px; border-radius: 15px; flex: none; }

        /* Inputs */
        .row {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px;
        }
        input, select {
            background-color: #333; color: white; border: 1px solid #555; padding: 10px;
            border-radius: 6px; font-size: 14px; width: 100%; box-sizing: border-box;
        }
        .input-short { width: 70px; text-align: center; font-weight: bold; padding: 8px 4px; }

        /* Players List */
        .player-item {
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 5px;
            background: #2a2a2a; padding: 8px 12px; margin-bottom: 5px; border-radius: 6px;
        }
        
        /* Table */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { padding: 8px; text-align: center; border-bottom: 1px solid var(--border-color); }
        th { color: var(--text-muted); font-weight: normal; }
        .gold { color: var(--accent-gold); font-weight: bold; }

        /* Modales */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); z-index: 1000;
            display: flex; justify-content: center; align-items: center;
        }
        .modal-content {
            background: var(--panel-bg); padding: 20px; border-radius: 12px;
            width: 95%; max-width: 400px; max-height: 90vh; overflow-y: auto;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <header>
        <img src="OIP.webp" alt="Logo">
        <select id="tournamentSelect" onchange="loadTournament()" style="flex:1;"></select>
        <button class="btn-small" onclick="openRenameModal()">✏️</button>
        <button class="btn-small btn-next" onclick="showModal('modal-new-tourney')">+ Créer</button>
    </header>

    <!-- Timer & Blinds -->
    <div class="card">
        <div class="blinds-display">
            <span class="level-badge" id="levelDisplay">Niv. 1</span>
            <div><span id="sb">10</span> / <span id="bb">20</span></div>
            <button class="btn-struct" onclick="openStructureModal()">⚙️ Modifier Blinds & Temps</button>
        </div>
        <div class="timer-display" id="timeDisplay">15:00</div>
        <div class="controls">
            <button class="btn-play" id="btnPlay" onclick="toggleTimer()">▶ Play</button>
            <button class="btn-next" onclick="nextLevel()">⏭ Suiv.</button>
            <button onclick="confirmAction(this, resetTimer, '🔄 Reset')">🔄 Reset</button>
        </div>
    </div>

    <!-- Paramètres -->
    <div class="card">
        <h3>Paramètres financiers</h3>
        <div class="row">
            <label>Buy-in (€)</label>
            <input type="number" class="input-short" id="buyin" onchange="saveSettings()">
        </div>
        <div class="row">
            <label>Total des Recaves (Auto)</label>
            <input type="number" class="input-short" id="rebuysTotal" readonly style="background:#222; color:var(--accent-orange); border:none;">
        </div>
    </div>

    <!-- Gestion des Joueurs -->
    <div class="card">
        <h3>Joueurs Inscrits : <span id="playerCount">0</span></h3>
        <div class="row">
            <input type="text" id="newPlayerName" placeholder="Nom du joueur...">
            <button class="btn-small btn-next" onclick="addPlayer()">Ajouter</button>
