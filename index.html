<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Balises pour l'application iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Poker">
    <link rel="apple-touch-icon" href="OIP.webp">
    <link rel="icon" href="OIP.webp" type="image/webp">
    
    <title>Poker Timer</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --accent-red: #d32f2f;
            --accent-green: #2e7d32;
            --accent-blue: #1976d2;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none; /* Évite la sélection de texte sur mobile */
        }

        header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 600px;
        }

        header img {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            object-fit: cover;
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        .card {
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* Timer & Blinds */
        .timer-display {
            font-size: 64px;
            font-weight: bold;
            text-align: center;
            margin: 10px 0;
            color: var(--accent-green);
        }

        .blinds-display {
            text-align: center;
            font-size: 28px;
            color: var(--accent-red);
            margin-bottom: 15px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        button {
            background-color: #333;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            flex: 1;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:active {
            background-color: #555;
        }

        .btn-play { background-color: var(--accent-green); }
        .btn-pause { background-color: #ff9800; }
        .btn-next { background-color: var(--accent-blue); }

        /* Inputs & Flex rows */
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .row label {
            font-size: 16px;
            color: var(--text-muted);
        }

        input[type="number"], input[type="text"], select {
            background-color: #333;
            color: white;
            border: 1px solid #444;
            padding: 8px;
            border-radius: 6px;
            font-size: 16px;
            width: 80px;
            text-align: center;
        }
        
        select {
            width: 150px;
        }

        .stepper {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .stepper button {
            flex: none;
            width: 35px;
            padding: 8px 0;
        }

        /* Points Table */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 8px;
            text-align: center;
            border-bottom: 1px solid #444;
        }

        th {
            color: var(--text-muted);
            font-weight: normal;
        }

    </style>
</head>
<body>

    <header>
        <img src="OIP.webp" alt="Logo Poker">
        <h1 id="tournamentName">Tournoi Principal</h1>
    </header>

    <!-- Section Chronomètre et Blinds -->
    <div class="card">
        <div class="blinds-display">
            Blinds: <span id="sb">10</span> / <span id="bb">20</span>
        </div>
        <div class="timer-display" id="timeDisplay">15:00</div>
        
        <div class="controls">
            <button class="btn-play" id="btnPlay" onclick="toggleTimer()">▶ Play</button>
            <button class="btn-next" onclick="nextLevel()">⏭ Suivant</button>
            <button onclick="resetTimer()">🔄 Reset</button>
        </div>
    </div>

    <!-- Section Paramètres du Tournoi -->
    <div class="card">
        <h3>Paramètres du Tournoi</h3>
        <div class="row">
            <label>Nom du Tournoi</label>
            <input type="text" id="tourneyInput" value="Tournoi Principal" onchange="updateTourneyName()" style="width: 150px;">
        </div>
        <div class="row">
            <label>Durée des rounds (min)</label>
            <input type="number" id="roundDuration" value="15" min="1" onchange="updateDuration()">
        </div>
        <div class="row">
            <label>Petite Blind Départ</label>
            <input type="number" id="startSb" value="10" min="1" onchange="updateCustomBlinds()">
        </div>
    </div>

    <!-- Section Joueurs -->
    <div class="card">
        <h3>Gestion des Joueurs</h3>
        <div class="row">
            <label>Joueurs Inscrits</label>
            <div class="stepper">
                <button onclick="changeValue('inscrits', -1)">-</button>
                <input type="number" id="inscrits" value="8" min="2" onchange="calculatePoints()">
                <button onclick="changeValue('inscrits', 1)">+</button>
            </div>
        </div>
        <div class="row">
            <label>Joueurs Restants</label>
            <div class="stepper">
                <button onclick="changeValue('restants', -1)">-</button>
                <input type="number" id="restants" value="8" min="1">
                <button onclick="changeValue('restants', 1)">+</button>
            </div>
        </div>
        <div class="row">
            <label>Recaves (Rebuys)</label>
            <div class="stepper">
                <button onclick="changeValue('rebuys', -1)">-</button>
                <input type="number" id="rebuys" value="0" min="0" onchange="calculatePoints()">
                <button onclick="changeValue('rebuys', 1)">+</button>
            </div>
        </div>
        <div class="row">
            <label>Prix d'entrée (Buy-in)</label>
            <input type="number" id="buyin" value="20" min="0" onchange="calculatePoints()">
        </div>
    </div>

    <!-- Section Points et Gains -->
    <div class="card">
        <h3>Répartition (Points & Prizepool)</h3>
        <div class="row">
            <label>Prizepool Total :</label>
            <strong id="prizepoolTotal" style="color: var(--accent-green); font-size: 18px;">160 €</strong>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Position</th>
                    <th>Points (Ligue)</th>
                    <th>Gains Estimés</th>
                </tr>
            </thead>
            <tbody id="pointsTableBody">
                <!-- Généré par JS -->
            </tbody>
        </table>
    </div>

    <script>
        // Variables Timer
        let timeRemaining = 15 * 60; 
        let timerInterval = null;
        let isRunning = false;
        let currentLevel = 1;
        
        // Configuration de base
        let baseDuration = 15;
        let baseSb = 10;

        // Éléments DOM
        const timeDisplay = document.getElementById('timeDisplay');
        const btnPlay = document.getElementById('btnPlay');
        const sbDisplay = document.getElementById('sb');
        const bbDisplay = document.getElementById('bb');

        // Formater le temps (MM:SS)
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        // Mettre à jour l'affichage des blinds
        function updateBlindsDisplay() {
            // Logique simple : la blind double tous les X niveaux (ex: 10/20, 20/40, 40/80...)
            // Ou on applique un multiplicateur selon le niveau
            let multiplier = currentLevel === 1 ? 1 : 
                             currentLevel === 2 ? 2 : 
                             currentLevel === 3 ? 3 : 
                             currentLevel === 4 ? 4 : 
                             currentLevel === 5 ? 6 : 
                             currentLevel === 6 ? 8 : currentLevel * 2;

            let sb = baseSb * multiplier;
            let bb = sb * 2;
            
            sbDisplay.innerText = sb;
            bbDisplay.innerText = bb;
        }

        // Contrôle du timer
        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerInterval);
                btnPlay.innerText = "▶ Play";
                btnPlay.classList.replace('btn-pause', 'btn-play');
            } else {
                timerInterval = setInterval(() => {
                    if (timeRemaining > 0) {
                        timeRemaining--;
                        timeDisplay.innerText = formatTime(timeRemaining);
                    } else {
                        // Fin du round
                        clearInterval(timerInterval);
                        alert("Fin du niveau ! Augmentation des blinds.");
                        nextLevel();
                    }
                }, 1000);
                btnPlay.innerText = "⏸ Pause";
                btnPlay.classList.replace('btn-play', 'btn-pause');
            }
            isRunning = !isRunning;
        }

        function nextLevel() {
            currentLevel++;
            timeRemaining = baseDuration * 60;
            timeDisplay.innerText = formatTime(timeRemaining);
            updateBlindsDisplay();
        }

        function resetTimer() {
            if (isRunning) toggleTimer();
            currentLevel = 1;
            timeRemaining = baseDuration * 60;
            timeDisplay.innerText = formatTime(timeRemaining);
            updateBlindsDisplay();
        }

        function updateDuration() {
            baseDuration = parseInt(document.getElementById('roundDuration').value) || 15;
            if (!isRunning) {
                timeRemaining = baseDuration * 60;
                timeDisplay.innerText = formatTime(timeRemaining);
            }
        }

        function updateCustomBlinds() {
            baseSb = parseInt(document.getElementById('startSb').value) || 10;
            updateBlindsDisplay();
        }

        function updateTourneyName() {
            document.getElementById('tournamentName').innerText = document.getElementById('tourneyInput').value;
        }

        // Gestion des compteurs (+ / -)
        function changeValue(id, delta) {
            const input = document.getElementById(id);
            let val = parseInt(input.value) + delta;
            if (val >= input.min) {
                input.value = val;
                if (id !== 'restants') calculatePoints();
            }
        }

        // Calcul des points (Basé sur une formule type racine carrée) et répartition du Prizepool
        function calculatePoints() {
            const inscrits = parseInt(document.getElementById('inscrits').value) || 2;
            const rebuys = parseInt(document.getElementById('rebuys').value) || 0;
            const buyin = parseFloat(document.getElementById('buyin').value) || 0;
            
            const totalEntrees = inscrits + rebuys;
            const prizepool = totalEntrees * buyin;
            document.getElementById('prizepoolTotal').innerText = prizepool + " €";

            // Déterminer le nombre de places payées (environ 25% des inscrits)
            let placesPayees = Math.max(1, Math.ceil(inscrits / 4));
            
            const tbody = document.getElementById('pointsTableBody');
            tbody.innerHTML = '';

            for (let i = 1; i <= inscrits; i++) {
                // Formule de points type ligue : Racine(Inscrits) / Racine(Position) * 10
                let points = Math.round((Math.sqrt(inscrits) / Math.sqrt(i)) * 10);
                
                // Répartition simplifiée du prizepool (50% au 1er, 30% au 2e, 20% au 3e...)
                let gain = 0;
                if (i <= placesPayees) {
                    if (placesPayees === 1) gain = prizepool;
                    else if (placesPayees === 2) gain = i === 1 ? prizepool * 0.65 : prizepool * 0.35;
                    else if (placesPayees === 3) gain = i === 1 ? prizepool * 0.50 : i === 2 ? prizepool * 0.30 : prizepool * 0.20;
                    else {
                        // Formule dégressive générique pour plus de 3 places payées
                        let part = (placesPayees - i + 1) / ((placesPayees * (placesPayees + 1)) / 2);
                        gain = prizepool * part;
                    }
                }

                tbody.innerHTML += `
                    <tr>
                        <td>${i}${i === 1 ? 'er' : 'e'}</td>
                        <td>${points} pts</td>
                        <td style="color: ${gain > 0 ? 'var(--accent-green)' : 'var(--text-muted)'}">
                            ${gain > 0 ? Math.round(gain) + ' €' : '-'}
                        </td>
                    </tr>
                `;
            }
        }

        // Initialisation au chargement
        window.onload = () => {
            timeDisplay.innerText = formatTime(timeRemaining);
            updateBlindsDisplay();
            calculatePoints();
        };
    </script>
</body>
</html>
