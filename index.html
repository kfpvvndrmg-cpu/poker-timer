<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Poker">
    <link rel="apple-touch-icon" href="OIP.webp">
    <link rel="icon" href="OIP.webp" type="image/webp">
    
    <title>Poker Timer V4</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --accent-red: #d32f2f;
            --accent-green: #2e7d32;
            --accent-blue: #1976d2;
            --accent-orange: #ff9800;
            --border-color: #333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 600px;
        }

        header img {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            object-fit: cover;
        }

        .card {
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* Timer & Blinds */
        .timer-display {
            font-size: 65px;
            font-weight: bold;
            text-align: center;
            margin: 0;
            color: var(--accent-green);
        }

        .blinds-display {
            text-align: center;
            font-size: 26px;
            color: var(--accent-red);
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .level-badge {
            font-size: 14px;
            background: #333;
            padding: 4px 10px;
            border-radius: 20px;
            color: white;
            margin-bottom: 5px;
        }

        .controls { display: flex; gap: 10px; margin-top: 10px; }
        
        button {
            background-color: #333; color: white; border: none;
            padding: 12px; border-radius: 8px; font-size: 14px;
            cursor: pointer; font-weight: bold; flex: 1; transition: background 0.2s;
        }
        .btn-play { background-color: var(--accent-green); }
        .btn-pause { background-color: var(--accent-orange); }
        .btn-next { background-color: var(--accent-blue); }
        .btn-danger { background-color: var(--accent-red); }
        .btn-small { padding: 8px 10px; font-size: 12px; flex: none; }
        .btn-struct { background: #444; color: #fff; margin-top: 5px; font-size: 12px; padding: 5px 15px; border-radius: 15px; }

        /* Inputs */
        .row {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px; gap: 10px;
        }
        input, select, textarea {
            background-color: #333; color: white; border: 1px solid #555;
            padding: 8px; border-radius: 6px; font-size: 14px;
            width: 100%; box-sizing: border-box;
        }
        .input-short { width: 80px; text-align: center; font-weight: bold; }

        /* Players List */
        .player-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #2a2a2a; padding: 8px 12px; margin-bottom: 5px; border-radius: 6px;
        }
        .player-name { font-weight: bold; }
        
        /* Table */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { padding: 8px; text-align: center; border-bottom: 1px solid var(--border-color); }
        th { color: var(--text-muted); font-weight: normal; }
        .gold { color: #ffd700; font-weight: bold; }

        /* Fenêtres Modales Custom */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8); z-index: 1000;
            display: flex; justify-content: center; align-items: center;
        }
        .modal-content {
            background: var(--panel-bg); padding: 20px; border-radius: 12px;
            width: 90%; max-width: 400px; text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <header>
        <img src="OIP.webp" alt="Logo">
        <select id="tournamentSelect" onchange="loadTournament()"></select>
        <button class="btn-small btn-next" onclick="showModal('modal-new-tourney')">+ Créer</button>
    </header>

    <!-- Timer & Blinds -->
    <div class="card">
        <div class="blinds-display">
            <span class="level-badge" id="levelDisplay">Niv. 1</span>
            <div><span id="sb">10</span> / <span id="bb">20</span></div>
            <button class="btn-struct" onclick="openBlindsModal()">⚙️ Modifier Structure des Blinds</button>
        </div>
        <div class="timer-display" id="timeDisplay">15:00</div>
        <div class="controls">
            <button class="btn-play" id="btnPlay" onclick="toggleTimer()">▶ Play</button>
            <button class="btn-next" onclick="nextLevel()">⏭ Suiv.</button>
            <button onclick="confirmReset(this)">🔄 Reset</button>
        </div>
    </div>

    <!-- Paramètres -->
    <div class="card">
        <h3>Paramètres du tournoi</h3>
        <div class="row">
            <label>Nom du Tournoi</label>
            <input type="text" id="tourneyNameInput" style="width: 60%;" onchange="renameTournament()">
        </div>
        <div class="row">
            <label>Durée rounds (min)</label>
            <input type="number" class="input-short" id="roundDuration" onchange="saveSettings()">
        </div>
        <div class="row">
            <label>Buy-in (€)</label>
            <input type="number" class="input-short" id="buyin" onchange="saveSettings(); updateUI()">
        </div>
        <div class="row">
            <label>Recaves Totales</label>
            <div style="display:flex; gap:5px;">
                <button class="btn-small" onclick="changeRebuys(-1)">-</button>
                <input type="number" class="input-short" id="rebuys" readonly>
                <button class="btn-small" onclick="changeRebuys(1)">+</button>
            </div>
        </div>
    </div>

    <!-- Gestion des Joueurs -->
    <div class="card">
        <h3>Joueurs Inscrits : <span id="playerCount">0</span></h3>
        <div class="row">
            <input type="text" id="newPlayerName" placeholder="Nom du joueur...">
            <button class="btn-small btn-next" onclick="addPlayer()">Ajouter</button>
        </div>
        <div id="activePlayersList">
            <!-- Liste des joueurs en jeu -->
        </div>
    </div>

    <!-- Tableau des Scores -->
    <div class="card">
        <div class="row">
            <h3>Classement & Scores</h3>
            <strong style="color: var(--accent-green);">Prizepool: <span id="prizepoolTotal">0</span> €</strong>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Pos.</th>
                    <th>Joueur</th>
                    <th>Pts</th>
                    <th>Gain</th>
                </tr>
            </thead>
            <tbody id="leaderboard">
                <!-- Généré par JS -->
            </tbody>
        </table>
    </div>

    <!-- ZONE DES MODALES (Fenêtres pop-up custom) -->
    <div id="modalOverlay" class="modal-overlay" style="display:none;">
        
        <!-- Créer Tournoi -->
        <div id="modal-new-tourney" class="modal-content" style="display:none;">
            <h3>Créer un nouveau tournoi</h3>
            <input type="text" id="newTourneyInput" placeholder="Ex: Soirée Poker Samedi" style="margin-bottom: 15px;">
            <div class="controls">
                <button class="btn-danger" onclick="hideModals()">Annuler</button>
                <button class="btn-play" onclick="confirmCreateTourney()">Créer</button>
            </div>
        </div>

        <!-- Modifier Blinds -->
        <div id="modal-blinds" class="modal-content" style="display:none
